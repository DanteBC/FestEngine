clone_depth: 1
skip_branch_with_pr: true
image:
    - Visual Studio 2019
    - Ubuntu2204
environment:
  APPVEYOR_RDP_PASSWORD:
    secure: MPAYz75AKBf954hdYvzz2VoCxy5RJLBdg0fajQ1SQUU=
  matrix:
    - ARCH: '64'
      VLC: 'latest'
#    - ARCH: '32'
#      VLC: '2.2.8'
# I used the 32-bit version only once


for:
-
  matrix:
    only:
      - image: Ubuntu2204
        ARCH: '64'
  install:
    # Системные зависимости
    - sudo apt clean
    - sudo apt update --fix-missing
    - sudo apt install -y --fix-broken
    - sudo apt install -y gettext vlc libjpeg-dev zlib1g-dev libgtk-3-dev pkg-config build-essential python3.10 python3.10-venv python3.10-dev
      
    # Создаем виртуальное окружение (для кэширования)
    - python3.10 -m venv venv
    - source venv/bin/activate
    
    # Обновляем pip
    - pip install --upgrade pip setuptools wheel
    
    # Устанавливаем wxPython (обязательно!)
    - pip install --no-cache-dir --prefer-wheel -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 wxpython==4.2.5
    # Остальные зависимости
    - pip install pyinstaller python-vlc numpy

  build_script:
    - source venv/bin/activate
    - cd bin
    - python3 build.py -novlc
    - mkdir -p ./FestEngine/locale/ru/LC_MESSAGES
    - msgfmt -o ./FestEngine/locale/ru/LC_MESSAGES/main.mo ../src/locale/ru/LC_MESSAGES/main.po
    - tar -zcvf fest_engine-linux-x64-minimal.tar.gz FestEngine
    - cd ..

  artifacts:
    - name: FestEngine Linux 64bit Minimal
      path: bin/fest_engine-linux-x64-minimal.tar.gz

  cache:
    - venv
    - /home/runner/.cache/pip
-
  matrix:
    only:
      - image: Visual Studio 2019

# init:
#  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
# on_finish:
#  - ps: $blockRdp = $true; iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

  install:
    - ps: |
        Import-Module -Force "$env:APPVEYOR_BUILD_FOLDER/bin/ci.psm1"
        FestEngineGetDeps

  build_script:
    - ps: FestEngineBuild

  before_test:
    - cmd: |
        echo --- Downloading test data ---
        git submodule update --init --recursive

  test_script:
    - cmd: |
        echo --- Running tests ---
        "%PYTHON_PATH%/python.exe" -m unittest discover "./test"

  after_test:
    - ps: FestEnginePackage

  artifacts:
    - name: FestEngine $(ver) Windows $(arch)bit VLC $(vlc_version) Debug
      path: bin/fest_engine-$(ver)-win$(arch)-VLCv$(vlc_version)-debug.zip
    - name: FestEngine $(ver) Windows $(arch)bit VLC $(vlc_version) Full
      path: bin/fest_engine-$(ver)-win$(arch)-VLCv$(vlc_version)-full.zip
    - name: FestEngine $(ver) Windows $(arch)bit Minimal
      path: bin/fest_engine-$(ver)-win$(arch)-minimal.zip



deploy:
    - provider: GitHub
      description: 'Auto-created Release'
      auth_token:
        secure: 06zyQQoLTbDrZIw5UjHOaDSvSiobT+8/V2F2E269BRmDYV5r4HgirmL/1nTMQjOA
      draft: true
      prerelease: true
      on:
        APPVEYOR_REPO_TAG: true
